name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that is already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # The npm cache needs the LOCK file, not package.json — pointing it at
          # package.json meant the cache silently never hit.
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Rodar testes
        # No --passWithNoTests: an empty suite is a failure, not a pass.
        run: npm test -- --forceExit --ci
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      # Só as dependências que EMBARCAM. Vulnerabilidade em ferramenta de build
      # não vai para produção, e misturar as duas coisas produz um alarme que
      # ninguém mais lê. O corte é `critical`: as três `high` que restam hoje
      # exigem migrar para o Nest 11 e estão justificadas uma a uma em
      # SDD/05-seguranca/DEPENDENCIAS.md — o dia em que aparecer uma crítica,
      # esta etapa reprova o build.
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=critical
        working-directory: backend

  frontend:
    name: Frontend — typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      # `npm run build` já roda `tsc -b` antes do vite build
      - name: Typecheck e build
        run: npm run build
        working-directory: frontend

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

  docker:
    name: Imagem do backend builda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The API is deployed as a container — if the Dockerfile breaks, CI must
      # say so here and not on Railway.
      - name: Build da imagem
        run: docker build -t ticket-to-ride-api:ci ./backend
