# Ambiente local: Postgres, Redis e a API em watch.
# As credenciais vêm de backend/.env — nada de segredo neste arquivo.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ttr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_to_ride
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ttr-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: ttr-api
    restart: unless-stopped
    command: npm run start:dev
    env_file:
      - ./backend/.env
    environment:
      # Override DB/Redis URLs to use Docker service names
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ticket_to_ride
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
