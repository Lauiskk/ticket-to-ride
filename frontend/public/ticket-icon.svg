<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ticket to Ride">
  <!--
    Favicon: 3/4-front steam locomotive.

    Drawn separately from the navbar logo on purpose. The navbar version can
    afford spokes, rivets and connecting rods at 36px; a favicon is read at
    16px, where all of that collapses into grey mush. So this is the same
    subject reduced to four shapes that survive: round boiler face, headlight,
    chimney, smoke.
  -->
  <defs>
    <clipPath id="badge">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <!-- Warm ground, like aged card stock -->
    <rect width="64" height="64" fill="#F5E6D3"/>
    <circle cx="32" cy="30" r="26" fill="#E8D5BC"/>

    <!-- Smoke: three puffs, biggest last so it reads as movement -->
    <circle cx="20" cy="12" r="4" fill="#1B2838" opacity=".22"/>
    <circle cx="13" cy="8"  r="5" fill="#1B2838" opacity=".16"/>
    <circle cx="27" cy="7"  r="3" fill="#1B2838" opacity=".12"/>

    <!-- Chimney -->
    <path d="M25 16h9v9h-9z" fill="#1B2838"/>
    <path d="M23 13h13v4H23z" fill="#1B2838"/>

    <!-- Boiler front, seen slightly from the side -->
    <path d="M18 26h28a4 4 0 0 1 4 4v14H14V30a4 4 0 0 1 4-4z" fill="#8B1A1F"/>
    <path d="M14 30a4 4 0 0 1 4-4h6v18h-10z" fill="#B8292F"/>

    <!-- Boiler band -->
    <rect x="14" y="33" width="36" height="3" fill="#D4A84B"/>

    <!-- Headlight — the one detail that must survive at 16px -->
    <circle cx="32" cy="30" r="6" fill="#1B2838"/>
    <circle cx="32" cy="30" r="4" fill="#F0D78C"/>

    <!-- Chassis and cow catcher -->
    <rect x="10" y="44" width="44" height="5" fill="#1B2838"/>
    <path d="M14 49h36l-4 6H18z" fill="#5C3D26"/>

    <!-- Wheels: solid discs, no spokes -->
    <circle cx="21" cy="53" r="6" fill="#1B2838"/>
    <circle cx="21" cy="53" r="2.5" fill="#D4A84B"/>
    <circle cx="43" cy="53" r="6" fill="#1B2838"/>
    <circle cx="43" cy="53" r="2.5" fill="#D4A84B"/>

    <!-- Rail -->
    <rect x="0" y="59" width="64" height="3" fill="#5C3D26"/>
  </g>
</svg>
